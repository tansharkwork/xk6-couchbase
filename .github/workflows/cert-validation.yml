name: Certificate validation

# The Enterprise image is large and slow to start, so this suite runs on demand
# or when the extension, the examples and scripts it runs, or the SDK
# dependencies change.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: &tls-paths
      - couchbase.go
      - tls.go
      - tls_test.go
      - Makefile
      - examples/test-client-cert.js
      - examples/test-new-with-shared-conn.js
      - examples/test-new-with-conn-per-vu.js
      - scripts/couchbase-enterprise.sh
      - scripts/run-cert-examples.sh
      - go.mod
      - go.sum
      - .github/workflows/cert-validation.yml
  pull_request:
    branches: [master]
    paths: *tls-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  enterprise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and run certificate acceptance
        run: make validate-cert
      - name: Remove Enterprise fixture
        if: always()
        run: make couchbase-enterprise-down
