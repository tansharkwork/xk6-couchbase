name: Secret scan

# Scans the full git history for committed credentials, including generic
# secrets such as private keys and connection-string passwords that GitHub's
# provider-pattern secret scanning does not detect.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      # --redact keeps any detected secret out of the job log.
      - name: Scan git history
        run: gitleaks git --redact --verbose --log-opts="--all" .
